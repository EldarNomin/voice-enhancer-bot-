name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse Windows PowerShell script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          & ./scripts/windows.ps1 -Action Init
          $before = (Get-FileHash .env).Hash
          & ./scripts/windows.ps1 -Action Init
          if ((Get-FileHash .env).Hash -ne $before) { throw 'Init overwrote .env' }
          & ./scripts/test_windows.ps1
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://voice:voice@localhost:5432/voice
      TEST_REDIS_URL: redis://localhost:6379/0
      DEEPFILTER_BIN: /tmp/deep-filter
      GTCRN_MODEL: /tmp/gtcrn_simple.onnx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg
        run: sudo apt-get update
      - name: Install FFmpeg package
        run: sudo apt-get install -y ffmpeg
      - name: Install project
        run: python -m pip install -c requirements.lock -e ".[dev,gtcrn]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Install pinned DeepFilterNet
        run: python scripts/install_deepfilter.py /tmp/deep-filter
      - name: Install pinned GTCRN
        run: python scripts/install_gtcrn.py /tmp/gtcrn_simple.onnx
      - name: Test
        run: python -m pytest -q
      - name: Validate Compose and build the worker image
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f compose.deepfilter.yml config --quiet
          docker compose -f docker-compose.yml -f compose.max-only.yml --profile max config --quiet
          docker compose -f docker-compose.yml -f compose.gtcrn.yml --profile max config --quiet
          docker compose -f docker-compose.yml -f compose.deepfilter.yml build worker
          docker compose -f docker-compose.yml -f compose.gtcrn.yml build worker
