services:
  bot:
    build: .
    env_file: .env
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    volumes:
      - media_data:/data/media
      - telegram_data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "voice_enhancer.worker"]
    env_file: .env
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    volumes:
      - media_data:/data/media
      - telegram_data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped

  init-db:
    build: .
    command: ["python", "-m", "voice_enhancer.infrastructure.init_db"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_data:/var/lib/telegram-bot-api
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "voice_enhancer.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  media_data:
  telegram_data:
