[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voice-enhancer-bot"
version = "0.1.0"
description = "Telegram and MAX bot that improves speech in video and audio"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=5,<8",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
gtcrn = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "numpy==2.5.3", "soundfile==0.14.0", "cffi==2.1.0", "pycparser==3.0"]
benchmark = ["numpy>=2,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1", "pystoi==0.4.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "aiosqlite>=0.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_enhancer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
